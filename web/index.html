<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payback</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="wordmark"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="13" width="5" height="9" rx="1"/><rect x="9.5" y="8" width="5" height="14" rx="1"/><rect x="17" y="2" width="5" height="20" rx="1"/></svg>Payback</div>
      <div class="head-end">
        <span class="chip hidden" id="demo">Demo data</span>
        <span class="mono dim" id="updated"></span>
        <button class="sq" id="refresh" title="Re-read Plex history now" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg></button>
      </div>
    </header>

    <main class="savings">
      <section class="sv-main">
        <div class="sv-hero">
          <div class="sv-in">
            <div class="sv-label">Streaming would have cost</div><div></div>
            <div class="sv-total" id="sv-total">–</div>
            <div class="sv-pct" id="sv-pct"></div>
            <div class="sv-date"><span class="sv-label">Est. payback</span><b id="sv-when">–</b></div>
            <div class="sv-bar"><i id="sv-fill"></i></div>
          </div>
        </div>
        <div class="sv-inner">
          <p class="sv-err hidden" id="sv-err"></p>
          <div class="sv-head"><h2>By month</h2></div>
          <div class="sv-chart" id="sv-chart"><svg id="sv-svg"></svg><div class="sv-tip" id="sv-tip"></div></div>
          <div class="sv-head"><h2>Where it would have gone</h2></div>
          <div class="sv-svc" id="sv-svc"></div>
          <div class="sv-head"><h2>Watched</h2></div>
          <nav class="sv-tabs" id="sv-tabs"></nav>
          <div class="sv-box" id="sv-box"></div>
          <div class="sv-sum" id="sv-sum"></div>
        </div>
      </section>
      <aside class="panel">
        <div class="box">
          <div class="row-head"><span class="label">Costs</span><span class="mono dim" id="sv-spent"></span></div>
          <div class="sv-kv" id="sv-costs"></div>
          <button class="add" id="cost-add">+ Add a cost</button>
        </div>
        <div class="box">
          <div class="row-head"><span class="label">Prices</span><span class="end"><span class="mono dim" id="sv-asof"></span><button class="sq" id="sv-reset" title="Reset prices" aria-label="Reset prices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg></button></span></div>
          <div class="sv-kv" id="sv-prices"></div>
        </div>
        <p class="credits">Release dates and streaming availability from <a href="https://www.themoviedb.org" rel="noreferrer" target="_blank">TMDB</a> and <a href="https://www.justwatch.com" rel="noreferrer" target="_blank">JustWatch</a>. This product uses the TMDB API but is not endorsed or certified by TMDB. Not affiliated with Plex.</p>
      </aside>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
